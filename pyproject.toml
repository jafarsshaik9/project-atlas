[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "Demo-only, read-only Trading 212 connectivity foundation"
requires-python = ">=3.13,<3.15"
dependencies = ["httpx>=0.28.1,<0.29", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
dashboard = ["fastapi>=0.115,<1", "jinja2>=3.1.6,<4", "uvicorn>=0.35,<1"]
cards = ["pillow>=12,<14"]
market-data = ["exchange-calendars==4.13.2", "tzdata>=2025.2,<2027"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["web/templates/*.html", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
